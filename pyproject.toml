[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflow"
version = "1.0.0"
description = "Supervised deep learning for joint 3T->7T domain translation and super-resolution of cerebrovascular 4D Flow MRI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["4D Flow MRI", "super-resolution", "deep learning", "cerebrovascular", "Circle of Willis"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch==2.10.*",
    "torchvision==0.25.*",
    "torchaudio==2.10.*",
    "monai==1.5.*",
    "tensorboard==2.20.*",
    "antspyx==0.6.*",
    "nibabel==5.3.*",
    "pydicom==3.0.*",
    "dicom2nifti==2.6.*",
    "SimpleITK==2.5.*",
    "h5py==3.15.*",
    "numpy==2.3.*",
    "scipy==1.15.*",
    "pandas==3.0.*",
    "scikit-learn==1.8.*",
    "scikit-image==0.26.*",
    "statsmodels==0.14.*",
    "matplotlib==3.10.*",
    "PyYAML==6.0.*",
]

[project.optional-dependencies]
# Visualization and aneurysm-geometry tooling (neuroflow.visualization.*,
# neuroflow.evaluation.calculate_aneurysm_shape_metrics).
viz = [
    "pyvista>=0.44",
    "vtk>=9.3",
    "imageio>=2.37",
]
# Circle-of-Willis segmentation. nnU-Net is used for inference only.
segmentation = [
    "nnunetv2==2.5.1",
    "batchgenerators==0.25.*",
    "ultralytics==8.4.*",
    "opencv-python-headless==4.13.*",
]
dev = [
    "pytest>=8.0",
    "pymupdf>=1.24",
]

[project.scripts]
neuroflow-dicom2nifti = "neuroflow.conversion.dicom_to_nifti:main"
neuroflow-train = "neuroflow.training.trainer_nifti:main"
neuroflow-predict = "neuroflow.inference.predict_nifti:main"
neuroflow-segment-cow = "neuroflow.segmentation.segment_cow_crops:main"

[tool.setuptools.packages.find]
include = ["neuroflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
